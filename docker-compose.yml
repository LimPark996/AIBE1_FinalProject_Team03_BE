# ════════════════════════════════════════════════════════════
# 🐳 TicketMon-Go Docker Compose 설정 파일
# 📄 파일명: docker-compose.yml
# ════════════════════════════════════════════════════════════
#
# Docker Compose란?
#   여러 개의 Docker 컨테이너를 한 번에 정의하고 실행할 수 있는 도구입니다.
#   이 파일 하나로 Redis, LocalStack, Nginx 등을 한꺼번에 띄울 수 있습니다.
#
#   실행 명령어: docker-compose up -d    (백그라운드 실행)
#   중지 명령어: docker-compose down      (컨테이너 종료 및 삭제)
#   로그 확인:   docker-compose logs -f   (실시간 로그 출력)
#
# Docker 컨테이너란?
#   애플리케이션과 그 실행 환경을 하나의 패키지로 묶어서 어디서든 동일하게
#   실행할 수 있게 해주는 경량 가상 환경입니다.
#   "내 컴퓨터에서는 되는데?"라는 문제를 해결해줍니다.
#
# ════════════════════════════════════════════════════════════

# Docker Compose 파일 형식의 버전
# 3.9는 Docker Engine 19.03+ 이상에서 지원되는 안정적인 버전입니다.
version: "3.9"


# ────────────────────────────────────────────────────────────
# 📦 services: 실행할 컨테이너(서비스)들을 정의하는 영역
# ────────────────────────────────────────────────────────────
# 각 서비스는 하나의 Docker 컨테이너에 해당합니다.
# 서비스 이름(redis-cache, localstack 등)은 Docker 네트워크 내에서
# 호스트명으로도 사용됩니다.
# 예: 다른 컨테이너에서 redis-cache:6379 로 Redis에 접속 가능
services:

  # ══════════════════════════════════════════════════════════
  # 🔴 Redis 컨테이너 — 캐시 & 분산 락 처리용
  # ══════════════════════════════════════════════════════════
  # Redis란?
  #   메모리(RAM)에 데이터를 저장하는 초고속 저장소입니다.
  #   디스크(HDD/SSD)보다 훨씬 빠른 메모리를 사용하므로 응답 속도가 매우 빠릅니다.
  #
  # 이 프로젝트에서의 역할:
  #   - 좌석 상태 캐싱 (DB 부하 감소)
  #   - 대기열 관리 (예매 대기 순번)
  #   - 분산 락 (동시 좌석 선택 방지)
  #   - 세션 관리 (사용자 접속 상태 추적)
  #
  # 📌 이 컨테이너는 개발~배포 전 단계에서 공통으로 사용됩니다.
  redis-cache:
    # 사용할 Docker 이미지
    # redis:7.0-alpine 의미:
    #   - redis: Redis 공식 이미지
    #   - 7.0: Redis 버전 7.0
    #   - alpine: Alpine Linux 기반 경량 이미지 (일반 이미지 ~130MB vs alpine ~30MB)
    #   Alpine Linux란? 보안과 가벼움에 초점을 맞춘 초경량 리눅스 배포판
    image: redis:7.0-alpine

    # Docker Desktop이나 docker ps 명령에서 보이는 컨테이너 이름
    # 이름을 지정하지 않으면 Docker가 랜덤 이름을 붙입니다.
    container_name: redis-cache

    # ── 포트 매핑 (Port Mapping) ──
    # 형식: "호스트포트:컨테이너포트"
    #
    # 컨테이너는 기본적으로 외부(호스트 PC)에서 접근할 수 없습니다.
    # 포트 매핑을 통해 호스트의 포트를 컨테이너의 포트에 연결합니다.
    #
    # "6379:6379" 의미:
    #   내 PC의 localhost:6379로 접속하면 → 컨테이너 안의 Redis(6379)로 연결됨
    #   즉, 로컬에서 redis-cli나 Spring Boot 앱이 localhost:6379로 접속하면
    #   이 컨테이너의 Redis에 연결됩니다.
    ports:
      - "6379:6379"

    # ── Redis 서버 실행 명령어 ──
    # 컨테이너가 시작될 때 실행할 명령어를 지정합니다.
    # 기본 명령어 대신 추가 옵션을 붙여서 실행합니다.
    #
    # --save 60 1
    #   RDB 스냅샷 저장 조건: 60초(1분) 동안 1개 이상의 키가 변경되면
    #   메모리의 전체 데이터를 디스크 파일(dump.rdb)로 저장합니다.
    #   RDB(Redis Database)란? 특정 시점의 전체 데이터를 파일로 저장하는 방식
    #   장점: 파일 크기가 작고 복원이 빠름
    #   단점: 마지막 스냅샷 이후의 데이터는 유실될 수 있음
    #
    # --appendonly yes
    #   AOF(Append Only File) 활성화: 모든 쓰기 작업을 로그 파일에 순서대로 기록합니다.
    #   장점: 데이터 유실이 거의 없음 (최대 1초 정도만 유실)
    #   단점: 파일 크기가 RDB보다 큼
    #
    # RDB + AOF를 함께 사용하면 → 두 가지 장점을 모두 활용하여 데이터 안전성 극대화
    command: redis-server --save 60 1 --appendonly yes

    # ── 볼륨 마운트 (Volume Mount) ──
    # 볼륨이란?
    #   컨테이너 외부에 데이터를 저장하는 공간입니다.
    #   컨테이너를 삭제해도 볼륨의 데이터는 보존됩니다.
    #
    # 만약 볼륨을 사용하지 않으면?
    #   docker-compose down 시 컨테이너가 삭제되면서 Redis 데이터도 함께 사라집니다.
    #
    # redis-data:/data 의미:
    #   "redis-data"라는 이름의 Docker 볼륨을 컨테이너의 /data 디렉토리에 연결
    #   Redis는 /data 디렉토리에 RDB/AOF 파일을 저장하므로,
    #   컨테이너를 재시작해도 데이터가 유지됩니다.
    volumes:
      - redis-data:/data

    # ── 헬스체크 (Health Check) ──
    # 컨테이너가 "정상 동작 중"인지 주기적으로 확인하는 설정입니다.
    # 다른 서비스가 depends_on에서 condition: service_healthy를 사용하면
    # 이 헬스체크가 통과된 후에야 해당 서비스가 시작됩니다.
    healthcheck:
      # redis-cli ping 명령어를 실행하여 Redis가 "PONG"으로 응답하는지 확인
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s   # 5초마다 헬스체크 실행
      timeout: 3s    # 3초 안에 응답이 없으면 실패로 판정
      retries: 5     # 5번 연속 실패하면 컨테이너를 "unhealthy" 상태로 표시


  # ══════════════════════════════════════════════════════════
  # ☁️ LocalStack 컨테이너 — AWS 서비스를 로컬에서 흉내내기
  # ══════════════════════════════════════════════════════════
  # LocalStack이란?
  #   AWS의 서비스(S3, SQS, Lambda 등)를 내 PC에서 가짜로(mock) 실행해주는 도구입니다.
  #   실제 AWS에 연결하지 않고도 개발/테스트할 수 있어서 비용이 들지 않습니다.
  #
  # 왜 사용하나요?
  #   - 개발 중에 매번 실제 AWS에 연결하면 비용이 발생합니다.
  #   - 인터넷 없이도 개발할 수 있습니다.
  #   - 실수로 운영 데이터를 건드리는 것을 방지합니다.
  #
  # 📌 초기 개발 단계에서 사용하고, 실제 AWS로 마이그레이션 후에는 불필요합니다.
  localstack:
    # LocalStack 최신 이미지 사용
    # :latest = 항상 최신 버전을 다운로드
    # ⚠️ 운영에서는 특정 버전(예: :3.0)을 지정하는 것이 안정적입니다.
    image: localstack/localstack:latest
    container_name: localstack

    # LocalStack은 모든 AWS 서비스를 하나의 포트(4566)로 제공합니다.
    # S3, SQS, Lambda 등 어떤 서비스든 localhost:4566으로 접속합니다.
    ports:
      - "4566:4566"

    # ── 환경 변수 (Environment Variables) ──
    # 컨테이너 내부에서 사용할 변수들을 설정합니다.
    environment:
      # 활성화할 AWS 서비스 목록
      # 현재는 SQS(Simple Queue Service, 메시지 큐)만 활성화
      # 여러 서비스 활성화 시: SERVICES=sqs,s3,lambda
      - SERVICES=sqs

      # 기본 AWS 리전 — ap-northeast-2는 서울 리전
      - AWS_DEFAULT_REGION=ap-northeast-2

      # 컨테이너 시작 시 자동으로 실행할 스크립트 경로
      # 이 경로에 쉘 스크립트(.sh)를 넣어두면 LocalStack이 시작될 때 자동 실행됩니다.
      # 예: SQS 큐를 미리 생성하는 스크립트
      - INIT_SCRIPTS_PATH=/docker-entrypoint-initaws.d

    # ── 바인드 마운트 (Bind Mount) ──
    # Named Volume과 달리, 로컬 PC의 특정 폴더를 컨테이너에 직접 연결합니다.
    #
    # ./localstack-init → 내 PC의 현재 폴더/localstack-init 디렉토리
    # :/docker-entrypoint-initaws.d → 컨테이너 내부의 초기화 스크립트 경로
    #
    # 이 폴더에 예를 들어 init-sqs.sh 파일을 넣어두면:
    #   #!/bin/bash
    #   awslocal sqs create-queue --queue-name ticket-queue
    # → 컨테이너 시작 시 자동으로 ticket-queue라는 SQS 큐가 생성됩니다.
    volumes:
      - ./localstack-init:/docker-entrypoint-initaws.d

    healthcheck:
      # awslocal: LocalStack 전용 AWS CLI 명령어
      # sqs list-queues: SQS 큐 목록을 조회 — 성공하면 SQS 서비스가 준비된 것
      test: [ "CMD-SHELL", "awslocal sqs list-queues" ]
      interval: 5s
      timeout: 5s
      retries: 5


  # ══════════════════════════════════════════════════════════
  # 🌐 Nginx 컨테이너 — 프론트엔드 서빙 & 리버스 프록시 (로컬 개발용)
  # ══════════════════════════════════════════════════════════
  # Nginx란?
  #   고성능 웹 서버/리버스 프록시 소프트웨어입니다.
  #
  # 이 프로젝트에서의 역할 (2가지):
  #   1. 정적 파일 서빙: 프론트엔드 빌드 결과물(HTML, CSS, JS)을 브라우저에 전달
  #   2. 리버스 프록시: /api/* 요청을 백엔드 Spring Boot 서버로 전달
  #
  # 리버스 프록시란?
  #   클라이언트(브라우저)가 직접 백엔드에 접속하는 대신,
  #   Nginx가 중간에서 요청을 받아 백엔드로 전달하고 응답을 돌려주는 역할입니다.
  #   장점: 보안 강화, 로드 밸런싱, SSL 처리 등
  #
  # 동작 흐름:
  #   브라우저 → localhost:80 → Nginx
  #     ├─ / (일반 페이지 요청) → 프론트엔드 HTML 파일 반환
  #     └─ /api/* (API 요청)    → 백엔드 서버(localhost:8080)로 전달
  nginx-frontend-server:
    # Nginx 공식 경량 이미지 (Alpine Linux 기반)
    image: nginx:alpine
    container_name: nginx-frontend-server

    # 80번 포트 = HTTP 웹 기본 포트
    # 브라우저에서 http://localhost 로 접속하면 이 컨테이너로 연결됩니다.
    # (http://localhost:80 과 http://localhost 는 동일합니다)
    ports:
      - "80:80"

    volumes:
      # ── Nginx 설정 파일 마운트 ──
      # 로컬의 nginx.conf 파일을 컨테이너의 Nginx 설정 경로에 연결합니다.
      #
      # ./nginx.conf → 백엔드 레포지토리 루트에 있는 Nginx 설정 파일
      # :/etc/nginx/conf.d/default.conf → Nginx가 읽는 기본 설정 파일 경로
      # :ro → Read Only (읽기 전용). 컨테이너가 이 파일을 수정할 수 없게 합니다.
      #       실수로 설정 파일이 변경되는 것을 방지합니다.
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

      # ── 프론트엔드 빌드 결과물 마운트 ──
      # 프론트엔드 프로젝트를 빌드(npm run build)하면 dist/ 폴더에
      # HTML, CSS, JS 파일이 생성됩니다.
      # 이 파일들을 Nginx의 웹 루트 디렉토리에 연결합니다.
      #
      # ../AIBE1_FinalProject_Team03_FE/dist → 프론트엔드 레포의 빌드 결과물
      # :/usr/share/nginx/html → Nginx가 웹 파일을 제공하는 기본 디렉토리
      #
      # ⚠️ 중요: 이 경로가 작동하려면 디렉토리 구조가 아래와 같아야 합니다:
      #   📁 부모폴더/
      #     ├── 📁 AIBE1_FinalProject_Team03_FE/   (프론트엔드 레포)
      #     │     └── 📁 dist/                      (빌드 결과물)
      #     └── 📁 백엔드레포/                       (이 docker-compose.yml이 있는 곳)
      #
      # ⚠️ 프론트엔드를 먼저 빌드(npm run build)한 후에 docker-compose up을 실행해야 합니다.
      - ../AIBE1_FinalProject_Team03_FE/dist:/usr/share/nginx/html:ro

    # ── 서비스 의존성 (depends_on) ──
    # 이 컨테이너가 시작되기 전에 먼저 준비되어야 하는 서비스를 지정합니다.
    # condition: service_healthy → 해당 서비스의 헬스체크가 통과된 후에 시작
    #
    # 📌 참고: 백엔드 앱(app)은 IDE(IntelliJ 등)에서 직접 실행하므로
    #    여기서는 의존성에 포함하지 않습니다.
    #    개발자가 먼저 IDE에서 백엔드를 실행한 후 docker-compose up을 해야 합니다.
    depends_on:
      localstack:
        condition: service_healthy   # LocalStack이 정상 상태가 된 후 시작
      redis-cache:
        condition: service_healthy   # Redis가 정상 상태가 된 후 시작

    healthcheck:
      # curl로 Nginx가 제대로 웹 페이지를 서빙하고 있는지 확인
      # -f 옵션: HTTP 에러 응답(4xx, 5xx) 시 실패로 처리
      test: ["CMD", "curl", "-f", "http://localhost/index.html"]
      interval: 5s
      timeout: 3s
      retries: 5


  # ══════════════════════════════════════════════════════════
  # 💤 WebSocket 서버 컨테이너 (추후 구현 예정 — 현재 비활성화)
  # ══════════════════════════════════════════════════════════
  # WebSocket이란?
  #   HTTP와 달리 서버와 클라이언트가 한 번 연결하면 계속 양방향으로
  #   데이터를 주고받을 수 있는 통신 프로토콜입니다.
  #
  # 사용 예정 기능:
  #   - 좌석 현황 실시간 업데이트 (다른 사용자가 좌석을 선택하면 즉시 반영)
  #   - 대기열 순번 실시간 알림
  #
  # 📌 좌석 실시간 반영 기능 구현 시 아래 주석을 해제하여 활성화합니다.
  #
  # app-websocket:
  #   build: .                              # 현재 디렉토리의 Dockerfile로 이미지 빌드
  #   container_name: websocket-server
  #   ports:
  #     - "8081:8081"                        # 백엔드(8080)와 다른 포트 사용
  #   depends_on:
  #     redis-cache:
  #       condition: service_healthy
  #     localstack:
  #       condition: service_healthy
  #   healthcheck:
  #     # Spring Boot Actuator의 헬스체크 엔드포인트로 확인
  #     # Actuator란? 앱의 상태, 메트릭 등을 모니터링할 수 있는 Spring Boot 기능
  #     test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3


  # ══════════════════════════════════════════════════════════
  # ⭐ 백엔드 Spring Boot 서버 컨테이너 (선택적 사용)
  # ══════════════════════════════════════════════════════════
  # 📌 대부분의 개발자는 IntelliJ 같은 IDE에서 직접 앱을 실행합니다.
  #    Docker로 백엔드를 실행하고 싶은 분만 아래 주석을 해제하세요.
  #
  # 언제 Docker로 실행하나요?
  #   - 다른 팀원의 환경과 동일한 환경에서 테스트하고 싶을 때
  #   - 운영 환경과 유사하게 테스트하고 싶을 때
  #   - CI/CD 파이프라인에서 자동 테스트할 때
  #
  # ── 주석 해제 시 참고 사항 ──
  # build:
  #   context: .              → Dockerfile이 있는 디렉토리 (현재 디렉토리)
  #   dockerfile: Dockerfile  → 사용할 Dockerfile 이름
  #   args:                   → 빌드 시 전달할 변수 (Dockerfile의 ARG와 매칭)
  #     GH_PACKAGES_USER      → GitHub Packages Maven 저장소 인증용 사용자명
  #     GH_PACKAGES_TOKEN     → GitHub Packages 인증용 PAT(Personal Access Token)
  #
  # env_file:
  #   - .env                  → .env 파일의 모든 변수를 컨테이너에 자동 로드
  #                             .env 파일에는 DB 비밀번호, API 키 등이 들어있습니다.
  #
  # environment:
  #   JAVA_OPTS               → JVM(Java 가상머신) 메모리 설정
  #     -Xmx512m              → 최대 힙 메모리 512MB
  #     -XX:MaxRAMPercentage=50.0 → 컨테이너 메모리의 50%까지만 JVM이 사용
  #   SQS_ENDPOINT=http://localstack:4566
  #     → 컨테이너끼리는 서비스 이름(localstack)으로 통신합니다.
  #       localhost가 아닌 localstack을 사용하는 이유:
  #       각 컨테이너는 독립된 네트워크 환경이므로 localhost는 자기 자신을 가리킵니다.
  #       Docker Compose가 만든 내부 네트워크에서는 서비스 이름이 DNS 호스트명 역할을 합니다.
  #
  # deploy.resources.limits:
  #   cpus: '0.5'             → CPU 0.5코어 제한 (과도한 CPU 사용 방지)
  #   memory: 768M            → 메모리 768MB 제한 (컨테이너가 호스트 메모리를 다 쓰는 것 방지)
  #
  # app:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #     args:
  #       GH_PACKAGES_USER: ${GH_PACKAGES_USER}
  #       GH_PACKAGES_TOKEN: ${GH_PACKAGES_TOKEN}
  #   ports:
  #     - "8080:8080"
  #   env_file:
  #     - .env
  #   environment:
  #     - GH_PACKAGES_USER=${GH_PACKAGES_USER}
  #     - GH_PACKAGES_TOKEN=${GH_PACKAGES_TOKEN}
  #     - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
  #     - JAVA_OPTS=-Xmx512m -XX:MaxRAMPercentage=50.0
  #     - SERVER_PORT=${SERVER_PORT}
  #     - DB_URL=${DB_URL}
  #     - DB_USERNAME=${DB_USERNAME}
  #     - DB_PASSWORD=${DB_PASSWORD}
  #     - SPRING_DATA_REDIS_HOST=${SPRING_DATA_REDIS_HOST}
  #     - SPRING_DATA_REDIS_PORT=${SPRING_DATA_REDIS_PORT}
  #     - SPRING_DATA_REDIS_USERNAME=${SPRING_DATA_REDIS_USERNAME}
  #     - SPRING_DATA_REDIS_PASSWORD=${SPRING_DATA_REDIS_PASSWORD}
  #     - SUPABASE_URL=${SUPABASE_URL}
  #     - SUPABASE_KEY=${SUPABASE_KEY}
  #     - SUPABASE_PROFILE_BUCKET=${SUPABASE_PROFILE_BUCKET}
  #     - SUPABASE_POSTER_BUCKET=${SUPABASE_POSTER_BUCKET}
  #     - SUPABASE_DOCS_BUCKET=${SUPABASE_DOCS_BUCKET}
  #     - JWT_SECRET_KEY=${JWT_SECRET_KEY}
  #     - JWT_ACCESS_EXPIRATION_MS=${JWT_ACCESS_EXPIRATION_MS}
  #     - JWT_REFRESH_EXPIRATION_MS=${JWT_REFRESH_EXPIRATION_MS}
  #     - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
  #     - AWS_SECRET_KEY=${AWS_SECRET_KEY}
  #     - SQS_ENDPOINT=http://localstack:4566
  #   depends_on:
  #     localstack:
  #       condition: service_healthy
  #     redis-cache:
