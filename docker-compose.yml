  # ══════════════════════════════════════════════════════════
  # ⚠️ MySQL 컨테이너 (비상용 — 현재 비활성화)
  # ══════════════════════════════════════════════════════════
  # 현재는 외부 관리형 DB(Aiven 또는 AWS RDS)를 사용하므로 이 컨테이너는 필요 없습니다.
  #
  # 언제 사용하나요?
  #   - 외부 DB에 장애가 발생했을 때 임시로 로컬 DB를 사용해야 할 때
  #   - 인터넷 없이 오프라인에서 개발해야 할 때
  #   - DB 스키마 변경을 안전하게 테스트하고 싶을 때
  #
  # 사용 시: 아래 주석을 해제하고, application-dev.yml의 datasource 설정을
  #          url: jdbc:mysql://localhost:3306/ticketing_db 로 변경하세요.
  #
  # mysql-db:
  #   image: mysql:8.0                         # MySQL 8.0 버전 이미지
  #   container_name: mysql-db
  #   ports:
  #     - "3306:3306"                           # MySQL 기본 포트
  #   environment:
  #     MYSQL_ROOT_PASSWORD: rootpass           # root 계정 비밀번호 (개발용이므로 간단하게)
  #     MYSQL_DATABASE: ticketing_db            # 컨테이너 시작 시 자동 생성할 DB 이름
  #     TZ: Asia/Seoul                          # 타임존을 한국 시간으로 설정
  #   volumes:
  #     - mysql-data:/var/lib/mysql             # MySQL 데이터 파일 저장 경로
  #   healthcheck:
  #     # mysqladmin ping: MySQL이 살아있는지 확인하는 가장 기본적인 방법
  #     test: [ "CMD", "mysqladmin", "ping", "-uroot", "-prootpass" ]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10                             # MySQL은 초기화에 시간이 걸리므로 재시도 횟수를 넉넉히


# ════════════════════════════════════════════════════════════
# 💾 Docker Named Volumes — 데이터 영속성을 위한 저장 공간
# ════════════════════════════════════════════════════════════
# Named Volume이란?
#   Docker가 관리하는 독립적인 데이터 저장 공간입니다.
#   컨테이너가 삭제(docker-compose down)되어도 데이터가 보존됩니다.
#
# 데이터까지 완전히 삭제하려면?
#   docker-compose down -v  (⚠️ -v 옵션은 볼륨도 함께 삭제합니다!)
#
# 볼륨 확인 명령어:
#   docker volume ls                    — 모든 볼륨 목록
#   docker volume inspect redis-data    — 특정 볼륨 상세 정보
volumes:
  # Redis 데이터를 저장하는 볼륨
  # 컨테이너를 재시작해도 캐시 데이터, 대기열 데이터가 유지됩니다.
  redis-data:

  # MySQL 데이터를 저장하는 볼륨 (현재는 MySQL 컨테이너가 비활성화 상태)
  # 미리 정의해두면 나중에 MySQL을 활성화할 때 바로 사용할 수 있습니다.
  mysql-data: